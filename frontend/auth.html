<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BC CourseFinder™ - Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-body auth-body">

  <!-- NAV -->
  <nav class="landing-nav">
    <a href="index.html" class="nav-brand" style="text-decoration:none;">
      <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#FFD700"/>
        <text x="18" y="24" font-size="18" font-weight="bold"
              fill="#111" text-anchor="middle" font-family="Arial">BC</text>
      </svg>
      <span class="nav-brand-name">BC CourseFinder™</span>
    </a>
    <a href="index.html" class="nav-back-link">← Back to Home</a>
  </nav>

  <!-- AUTH CARD -->
  <main class="auth-main">
    <div class="auth-card">

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Alert banner -->
      <div class="auth-alert hidden" id="authAlert"></div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-password-wrap">
            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-submit-btn" id="loginBtn">
          <span class="btn-label">Sign In</span>
          <span class="btn-spinner hidden"></span>
        </button>
        <p class="auth-switch-text">
          Don't have an account?
          <button type="button" class="auth-switch-link" onclick="switchTab('register')">Create one</button>
        </p>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="Your name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-password-wrap">
            <input type="password" id="regPassword" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6" />
            <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-strength" id="pwStrength"></div>
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <div class="input-password-wrap">
            <input type="password" id="regConfirm" placeholder="Repeat your password" required autocomplete="new-password" />
            <button type="button" class="toggle-pw" onclick="togglePassword('regConfirm', this)" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-submit-btn" id="registerBtn">
          <span class="btn-label">Create Account</span>
          <span class="btn-spinner hidden"></span>
        </button>
        <p class="auth-switch-text">
          Already have an account?
          <button type="button" class="auth-switch-link" onclick="switchTab('login')">Sign in</button>
        </p>
      </form>

    </div>

    <p class="auth-footer-note">
      By continuing you agree that this tool provides guidance only.
      Always verify details at
      <a href="https://www.belgiumcampus.ac.za" target="_blank" rel="noopener">belgiumcampus.ac.za</a>
    </p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
