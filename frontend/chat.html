<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BC CourseFinder™ - Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- ==================== HEADER ==================== -->
    <header class="chat-header">
      <div class="header-content">
        <a href="index.html" class="back-link" title="Back to home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <div class="header-icon">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="8" fill="#FFD700"/>
            <text x="18" y="24" font-size="18" font-weight="bold"
                  fill="#111" text-anchor="middle" font-family="Arial">BC</text>
          </svg>
        </div>
        <div class="header-text">
          <h1>BC CourseFinder™</h1>
          <p class="header-subtitle">AI Career Guidance for Matric Students</p>
        </div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span class="status-text">Online</span>
        </div>
        <div class="header-user" id="headerUser">
          <span class="header-user-name" id="headerUserName"></span>
          <button class="logout-btn" onclick="handleLogout()" title="Sign out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ==================== CHAT AREA ==================== -->
    <main class="chat-area" id="chatArea">
      <!-- Welcome message injected by JS -->
    </main>

    <!-- ==================== QUICK QUESTIONS ==================== -->
    <div class="quick-questions" id="quickQuestions">
      <p class="quick-label">Quick Questions:</p>
      <div class="quick-buttons">
        <button class="quick-btn" data-question="What careers can I study with Maths?">
          📐 Careers with Maths
        </button>
        <button class="quick-btn" data-question="What skills do I need to become a software developer?">
          💻 Become a Developer
        </button>
        <button class="quick-btn" data-question="What is the difference between a diploma and a degree?">
          🎓 Diploma vs Degree
        </button>
        <button class="quick-btn" data-question="Compare the different IT fields and careers available">
          🔄 Compare IT Fields
        </button>
        <button class="quick-btn" data-question="Can I study IT with Mathematical Literacy?">
          🧮 Study with Math Lit?
        </button>
      </div>
    </div>

    <!-- ==================== INPUT AREA ==================== -->
    <footer class="chat-input-area">
      <div class="input-container">
        <input
          type="text"
          id="userInput"
          class="chat-input"
          placeholder="Ask about IT careers, courses, or requirements..."
          autocomplete="off"
          maxlength="500"
        />
        <button id="sendBtn" class="send-btn" title="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-disclaimer">
        BC CourseFinder™ provides guidance only. Always verify details at
        <a href="https://www.belgiumcampus.ac.za" target="_blank" rel="noopener">belgiumcampus.ac.za</a>
      </p>
    </footer>
  </div>

  <script src="auth-check.js"></script>
  <script src="app.js"></script>
</body>
</html>
